name: Refresh Sound Comparisons data

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data and rebuild index.html
        run: python3 build.py

      - name: Commit if the data changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes in Sound Comparisons data."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh data from soundcomparisons.com ($(date -u +%Y-%m-%d))"
          git push
